services:
  keycloak-iga:
    image: tideorg/tidecloak-dev:latest
    container_name: rmit-keycloak-iga
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-adminpassword}
    volumes:
      - ./data/h2:/opt/keycloak/data/h2
